<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Запись на мероприятие</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        table { border-collapse: collapse; width: 100%; font-size: 14px; }
        th, td { border: 1px solid #999; padding: 8px; text-align: left; vertical-align: top; }
        th { background: #1a73e8; color: white; }
        input, button { padding: 6px; margin: 4px; }
        .form-block { background: #f0f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .form-block input { width: 200px; }
        .form-block label { display: inline-block; width: 70px; font-weight: bold; }
        .del-btn { color: red; cursor: pointer; font-weight: bold; }
        .count { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>📋 Запись на мероприятие</h2>
    
    <div class="form-block">
        <label>Дата:</label><input id="date"><br>
        <label>Название:</label><input id="name"><br>
        <label>СПО:</label><input id="spo"><br>
        <label>ВУЗ:</label><input id="vuz"><br>
        <button onclick="addRow()">➕ Добавить</button>
        <button onclick="saveData()">💾 Сохранить</button>
        <button onclick="exportCSV()">📤 Выгрузить CSV</button>
        <button onclick="clearAll()">🗑 Очистить всё</button>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width:15%">Дата</th>
                <th style="width:20%">Название</th>
                <th style="width:30%">Студент СПО (ФИО, курс, специальность)</th>
                <th style="width:30%">Студент ВУЗа (ФИО, курс, направление)</th>
                <th style="width:5%"></th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="count" id="rowCount">Всего строк: 0</div>

    <script>
        let rows = JSON.parse(localStorage.getItem('studentData')) || [];

        function render() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            rows.forEach((row, i) => {
                tbody.innerHTML += `<tr>
                    <td>${row.date || ''}</td>
                    <td>${row.name || ''}</td>
                    <td>${row.spo || ''}</td>
                    <td>${row.vuz || ''}</td>
                    <td><span class="del-btn" onclick="deleteRow(${i})">✕</span></td>
                </tr>`;
            });
            document.getElementById('rowCount').textContent = `Всего строк: ${rows.length}`;
        }

        function addRow() {
            const date = document.getElementById('date').value.trim() || '---';
            const name = document.getElementById('name').value.trim() || 'Без названия';
            const spo = document.getElementById('spo').value.trim() || 'ФИО, курс, специальность';
            const vuz = document.getElementById('vuz').value.trim() || 'ФИО, курс, направление';
            rows.push({ date, name, spo, vuz });
            document.getElementById('date').value = '';
            document.getElementById('name').value = '';
            document.getElementById('spo').value = '';
            document.getElementById('vuz').value = '';
            render();
            saveData();
        }

        function deleteRow(index) {
            if (confirm('Удалить строку?')) {
                rows.splice(index, 1);
                render();
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('studentData', JSON.stringify(rows));
            alert('✅ Сохранено!');
        }

        function clearAll() {
            if (confirm('Удалить ВСЕ строки?')) {
                rows = [];
                render();
                saveData();
            }
        }

        function exportCSV() {
            if (rows.length === 0) {
                alert('Нет данных для выгрузки');
                return;
            }
            let csv = 'Дата,Название,СПО (ФИО,курс,специальность),ВУЗ (ФИО,курс,направление)\n';
            rows.forEach(r => csv += `"${r.date}","${r.name}","${r.spo}","${r.vuz}"\n`);
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'students.csv';
            a.click();
        }

        render();
    </script>
</body>
</html>
